<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Face Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .alert-slide {
            animation: slideIn 0.35s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>

<body class="min-h-screen bg-[#f7f4ef] text-[#1f1f1f]">

<header class="h-16 bg-white border-b flex items-center justify-center shadow-sm">
    <h1 class="text-2xl font-bold text-[#735c00]">
        Face Attendance System
    </h1>
</header>

<div id="alertContainer" class="fixed top-5 right-5 z-50 space-y-3"></div>

<main class="max-w-5xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-6">

    <section class="bg-white p-5 rounded-2xl shadow">
        <h2 class="text-xl font-semibold mb-4">Camera</h2>

        <video
            id="video"
            width="640"
            height="480"
            autoplay
            playsinline
            class="w-full rounded-xl border-4 border-[#d4af37]"
            style="transform: scaleX(-1);"
        ></video>

        <p id="resultText" class="mt-4 p-3 rounded-lg bg-[#f1ead7] text-sm">
            Result: -
        </p>
    </section>

    <section class="space-y-6">

        <div class="bg-white p-5 rounded-2xl shadow">
            <h2 class="text-xl font-semibold mb-4">Tambah User Baru</h2>

            <input
                id="nameInput"
                type="text"
                placeholder="Nama user"
                class="w-full mb-3 px-4 py-3 border rounded-lg"
            >

            <input
                id="departmentInput"
                type="text"
                placeholder="Departemen"
                class="w-full mb-4 px-4 py-3 border rounded-lg"
            >

            <button
                id="addUserBtn"
                class="w-full bg-[#735c00] text-white py-3 rounded-lg font-semibold transition-transform duration-200 shadow-sm hover:-translate-y-0.5 hover:shadow-lg active:scale-95"
            >
                Tambah User
            </button>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow">
            <h2 class="text-xl font-semibold mb-4">Face Action</h2>

            <label class="block mb-2 font-medium">Pilih User:</label>

            <select
                id="userSelect"
                class="w-full mb-4 px-4 py-3 border rounded-lg"
            ></select>

            <div class="grid grid-cols-2 gap-3">
                <button
                    id="registerBtn"
                    class="border-2 border-[#735c00] text-[#735c00] py-3 rounded-lg font-semibold transition-transform duration-200 hover:-translate-y-0.5 hover:bg-[#735c00] hover:text-white active:scale-95"
                >
                    Register Face
                </button>

                <button
                    id="recognizeBtn"
                    class="bg-[#d4af37] text-black py-3 rounded-lg font-semibold transition-transform duration-200 hover:-translate-y-0.5 hover:bg-[#c69f1e] active:scale-95"
                >
                    Recognize
                </button>
            </div>
        </div>

    </section>

</main>

<script>
const video = document.getElementById("video");

const nameInput = document.getElementById("nameInput");
const departmentInput = document.getElementById("departmentInput");
const addUserBtn = document.getElementById("addUserBtn");

const userSelect = document.getElementById("userSelect");
const registerBtn = document.getElementById("registerBtn");
const recognizeBtn = document.getElementById("recognizeBtn");
const resultText = document.getElementById("resultText");

navigator.mediaDevices.getUserMedia({
    video: true
})
.then(stream => {
    video.srcObject = stream;
})
.catch(error => {
    showAlert("Kamera gagal: " + error.message, "error");
});

function showAlert(message, type = "success") {
    const container = document.getElementById("alertContainer");
    const alert = document.createElement("div");
    alert.className = `alert-slide max-w-sm rounded-xl border px-4 py-3 shadow-lg transition-opacity duration-300 ${type === "error" ? "border-red-300 bg-red-50 text-red-700" : "border-green-300 bg-green-50 text-green-700"}`;
    alert.textContent = message;

    container.appendChild(alert);

    setTimeout(() => {
        alert.style.opacity = "0";
        alert.style.transform = "translateX(20px)";
    }, 3500);

    setTimeout(() => {
        container.removeChild(alert);
    }, 4000);
}

async function loadUsers() {
    const response = await fetch("/api/users");
    const users = await response.json();

    userSelect.innerHTML = "";

    users.forEach(user => {
        const option = document.createElement("option");
        option.value = user.id;
        option.textContent = user.name;
        userSelect.appendChild(option);
    });
}

addUserBtn.addEventListener("click", async () => {
    const name = nameInput.value;
    const department = departmentInput.value;

    if (!name) {
        showAlert("Nama wajib diisi", "error");
        return;
    }

    const response = await fetch("/api/users", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            name: name,
            department: department
        })
    });

    const data = await response.json();

    showAlert("User dibuat: " + data.name, "success");

    nameInput.value = "";
    departmentInput.value = "";

    await loadUsers();
});

function captureImage() {
    const canvas = document.createElement("canvas");
    canvas.width = 640;
    canvas.height = 480;

    const ctx = canvas.getContext("2d");

    ctx.translate(640, 0);
    ctx.scale(-1, 1);

    ctx.drawImage(video, 0, 0, 640, 480);

    return canvas.toDataURL("image/jpeg");
}

registerBtn.addEventListener("click", async () => {
    const image = captureImage();

    const response = await fetch("/api/register-face", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            user_id: parseInt(userSelect.value),
            image: image
        })
    });

    const data = await response.json();

    showAlert(JSON.stringify(data), "success");
});

async function recognizeFace() {
    const image = captureImage();

    const response = await fetch("/api/recognize", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            image: image
        })
    });

    const data = await response.json();

    resultText.textContent = "Result: " + JSON.stringify(data);

    showAlert(JSON.stringify(data), "success");

    return data;
}

recognizeBtn.addEventListener("click", async () => {
    await recognizeFace();
});

//     if (isRecognizing) return;

//     isRecognizing = true;
//     await recognizeFace();
//     isRecognizing = false;
// }, 2000);


loadUsers();
</script>

</body>
</html>
